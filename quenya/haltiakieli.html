<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Varmin HTML-tason uudelleenohjaus 10 sekunnin kuluttua -->
    <meta http-equiv="refresh" content="10;url=https://kielioppikurssi.github.io/kielioppikurssi/">
    <title>Órenya quetë nin</title>
    <!-- Tailwind CSS tyylittelyyn -->

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Three.js ES Modules Importmap -->

            }
        }
    </script>
    <style>
        html, body {
            background-color: #000000 !important;
            color: #f3e5d0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* Pehmeä sisääntuloanimaatio läpinäkyvälle yläkuvalle */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-image-container {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 16px;
        }

        .hero-image {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            max-height: 120px;
            width: auto;
            max-width: 88vw;
            object-fit: contain;
            /* Kunnioittaa PNG-kuvan läpinäkyvyyttä ja antaa lämpimän hehkun */
            filter: drop-shadow(0 0 16px rgba(255, 145, 30, 0.42));
            animation: fadeInDown 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @media (max-width: 640px) {
            .hero-image-container {
                top: 18px;
            }
            .hero-image {
                max-height: 88px;
            }
        }

        /* Tulenhehkuva edistymispalkki */
        .ember-bar {
            background: linear-gradient(90deg, #9a3412 0%, #f97316 55%, #fde047 100%);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.85);
            transition: width 0.1s linear;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 10;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
            background: transparent;
        }
    </style>
</head>
<body class="bg-black text-amber-100">

    <!-- Yläkeskellä täysin läpinäkyvänä kelluva PNG-kuva -->
    <header class="hero-image-container">
        <img 
            id="top-png"
            src="Órenya_quetë_nin.png" 
            alt="Órenya quetë nin" 
            class="hero-image"
            onerror="this.style.display='none'"
        />
    </header>

    <!-- Koko ruudun 3D-näyttämö pelkistetylle tulenhehkuvalle sormukselle -->
    <main id="canvas-container" class="cursor-grab active:cursor-grabbing"></main>

    <!-- Alareunan hillitty 10 sekunnin laskuri ja klikattava varalinkki -->
   

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 2. PELKISTETTY TULENHEHKU-TEKSTUURI (ILMAN TEKSTIÄ TAI RIIMUJA)
        // ==========================================
        /**
         * Luo teksti- ja riimivapaan tulenhehku-emissiokartan, jossa hehku keskittyy
         * pehmeästi sormuksen reunoille ja sisäpinnan lämpimään hehkuun.
         */
        function createFieryGlowTexture() {
            const width = 1024;
            const height = 512;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Tumma pohja ilman mitään teksti- tai riimukuvioita
            ctx.fillStyle = '#080200';
            ctx.fillRect(0, 0, width, height);

            // Yläkaista (v: 0.5..1.0 -> y: 0..256): sormuksen ulkopinta
            const outerGrad = ctx.createLinearGradient(0, 0, 0, 256);
            outerGrad.addColorStop(0.0, 'rgba(255, 90, 10, 0.85)');
            outerGrad.addColorStop(0.18, 'rgba(255, 55, 0, 0.25)');
            outerGrad.addColorStop(0.5, 'rgba(255, 40, 0, 0.06)');
            outerGrad.addColorStop(0.82, 'rgba(255, 55, 0, 0.25)');
            outerGrad.addColorStop(1.0, 'rgba(255, 90, 10, 0.85)');
            ctx.fillStyle = outerGrad;
            ctx.fillRect(0, 0, width, 256);

            // Alakaista (v: 0.0..0.5 -> y: 256..512): sormuksen sisäpinta hehkuu lämpimän tulisesti
            const innerGrad = ctx.createLinearGradient(0, 256, 0, 512);
            innerGrad.addColorStop(0.0, 'rgba(255, 110, 15, 0.9)');
            innerGrad.addColorStop(0.5, 'rgba(255, 65, 5, 0.45)');
            innerGrad.addColorStop(1.0, 'rgba(255, 110, 15, 0.9)');
            ctx.fillStyle = innerGrad;
            ctx.fillRect(0, 256, width, 256);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        // ==========================================
        // 3. THREE.JS -NÄKYMÄ JA PELKISTETTY SORMUS
        // ==========================================
        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            const camera = new THREE.PerspectiveCamera(
                36,
                container.clientWidth / container.clientHeight,
                0.1,
                100
            );
            // Hieman kauempana, jotta sormus on tyylikkään pienempi ja ilmava
            camera.position.set(0, 0.55, 7.6);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            const emissiveTexture = createFieryGlowTexture();

            // Pelkistetty, sulavalinjainen ja hieman sirompi sormusprofiili
            const profilePoints = [];
            const profileSteps = 72;
            const innerRadius = 1.28;     // Pienempi ja sirompi säde
            const halfBandWidth = 0.41;   // Siro leveys
            const wallThickness = 0.24;   // Pelkistetty paksuus
            const outerDome = 0.10;
            const innerCurve = 0.035;

            for (let i = 0; i <= profileSteps; i++) {
                const t = (i / profileSteps) * Math.PI * 2;
                const cosT = Math.cos(t);
                const sinT = Math.sin(t);

                const y = Math.sign(sinT) * Math.pow(Math.abs(sinT), 0.78) * halfBandWidth;
                let r;
                if (cosT >= 0) {
                    r = innerRadius + wallThickness - outerDome + Math.pow(cosT, 0.62) * outerDome;
                } else {
                    r = innerRadius + (1.0 - Math.pow(Math.abs(cosT), 1.25)) * innerCurve;
                }
                profilePoints.push(new THREE.Vector2(r, y));
            }

            const ringGeometry = new THREE.LatheGeometry(profilePoints, 192);

            // UV-kartoitus: ulkopinta (v: 0.5..1.0) ja sisäpinta (v: 0.0..0.5)
            const uvAttr = ringGeometry.attributes.uv;
            const posAttr = ringGeometry.attributes.position;
            const midRadius = innerRadius + wallThickness * 0.48;

            for (let i = 0; i < uvAttr.count; i++) {
                const u = uvAttr.getX(i);
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);
                const radialDist = Math.hypot(x, z);
                const normY = THREE.MathUtils.clamp((y / (halfBandWidth * 2.0)) + 0.5, 0, 1);

                const v = radialDist >= midRadius
                    ? 0.50 + normY * 0.50
                    : normY * 0.50;

                uvAttr.setXY(i, u * 2.0, v);
            }
            uvAttr.needsUpdate = true;
            ringGeometry.computeVertexNormals();

            // Pelkistetty tumman Pronssinen / Obsidian-kultainen materiaali,
            // Pelkistetty tumman pronssinen / obsidian-kultainen materiaali ilman riimuja
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(0x261506),
                metalness: 0.9,
                roughness: 0.22,
                emissive: new THREE.Color(0xff6200),
                emissiveMap: emissiveTexture,
                emissiveIntensity: 1.55
            });

            const ringPivot = new THREE.Group();
            const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);

            // Klassinen diagonaalikallistus
            ringMesh.rotation.z = THREE.MathUtils.degToRad(26);
            ringMesh.rotation.x = THREE.MathUtils.degToRad(32);
            ringPivot.add(ringMesh);
            scene.add(ringPivot);

            // Hienovaraiset leijailevat tulikipinät sormuksen ympärillä
            const particleCount = 48;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSpeeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.1 + Math.random() * 1.4;
                particlePositions[i * 3] = Math.cos(angle) * radius;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 2.4;
                particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
                particleSpeeds[i] = 0.18 + Math.random() * 0.35;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0xff8c1a,
                size: 0.032,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const embers = new THREE.Points(particleGeo, particleMat);
            scene.add(embers);

            // Lämpimät reunavalot pelkistettyyn siluettiin
            const keyRimLight = new THREE.DirectionalLight(0xffb347, 2.2);
            keyRimLight.position.set(4, 5, 4);
            scene.add(keyRimLight);

            const backRimLight = new THREE.DirectionalLight(0xff5500, 1.8);
            backRimLight.position.set(-4, -3, -4);
            scene.add(backRimLight);

            const coreGlowLight = new THREE.PointLight(0xff6600, 2.5, 8);
            coreGlowLight.position.set(0, 0, 0.2);
            scene.add(coreGlowLight);

            // Post-processing: Bloom-hehku tulenhehkuville riimuille
            const composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(container.clientWidth, container.clientHeight),
                1.05,  // Voimakas mutta pehmeä tulihehku
                0.65,
                0.45
            );
            composer.addPass(bloomPass);

            // Hiiri- ja kosketusohjaus
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enableZoom = false;
            controls.enablePan = false;

            // Responsiivinen koonmuutos
            window.addEventListener('resize', () => {
                if (!container) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
                composer.setSize(w, h);
                bloomPass.resolution.set(w, h);
            });

            // Animaatiosilmukka
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Sormuksen rauhallinen pyöriminen ja kevyt leijunta
                ringPivot.rotation.y = elapsed * 0.5;
                ringPivot.position.y = Math.sin(elapsed * 1.2) * 0.05 - 0.22;

                // Tulen elävä syke sormuksen hehkussa
                const pulse = 1.45 + Math.sin(elapsed * 2.8) * 0.28 + Math.sin(elapsed * 6.5) * 0.08;
                ringMaterial.emissiveIntensity = pulse;
                coreGlowLight.intensity = 2.2 + Math.sin(elapsed * 3.0) * 0.55;

                // Nousevien kipinöiden päivitys
                const posArr = embers.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    posArr[i * 3 + 1] += particleSpeeds[i] * delta;
                    if (posArr[i * 3 + 1] > 1.35) {
                        posArr[i * 3 + 1] = -1.35;
                    }
                }
                embers.geometry.attributes.position.needsUpdate = true;
                embers.rotation.y = elapsed * 0.12;

                controls.update();
                composer.render();
            }

            animate();
        }

        // Käynnistys sivun latauduttua
        window.addEventListener('load', () => {
            initThreeScene();
            requestAnimationFrame(updateTimer);
        });
    </script>
</body>
