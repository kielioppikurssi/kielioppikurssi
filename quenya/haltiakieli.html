<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Varmin HTML-tason uudelleenohjaus 10 sekunnin kuluttua -->
    <meta http-equiv="refresh" content="10;url=https://kielioppikurssi.github.io/kielioppikurssi/">
    <title>Órenya quetë nin</title>
    <!-- Tailwind CSS tyylittelyyn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Three.js ES Modules Importmap -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        html, body {
            background-color: #000000 !important;
            color: #f3e5d0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* Pehmeä sisääntuloanimaatio läpinäkyvälle yläkuvalle */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Huomio: Jos PNG-kuva on tallennettu mustalla taustalla todellisen alfakanavan sijaan,
           kuva voi näkyä suorakulmiona. Kun PNG:ssä on aito läpinäkyvyys, alla olevat tyylit
           pitävät sen täysin reunattomana ja saumattomana mustalla taustalla. */
        #topImage {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            filter: none !important;
            display: block;
            margin: 0 auto;
            max-width: min(88vw, 620px);
            max-height: 26vh;
            width: auto;
            height: auto;
            object-fit: contain;
            animation: fadeInDown 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Tulenhehkuva edistymispalkki */
        .ember-bar {
            background: linear-gradient(90deg, #9a3412 0%, #f97316 55%, #fde047 100%);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.85);
            transition: width 0.08s linear;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 10;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
            background: transparent;
        }
    </style>
</head>
<body class="bg-black text-amber-100">

    <!-- Yläkeskellä suoraan mustalla taustalla oleva kuva ilman kehyksiä tai taustalaatikkoa -->
    <header class="fixed top-4 sm:top-6 inset-x-0 z-30 pointer-events-none px-4">
        <img
            id="topImage"
            src="Órenya_quetë_nin.png"
            alt="Órenya quetë nin"
            onerror="this.style.display='none'"
        />
    </header>

    <!-- Koko ruudun 3D-näyttämö pelkistetylle tulenhehkuvalle sormukselle -->
    <main id="canvas-container" class="cursor-grab active:cursor-grabbing"></main>

    <!-- Alareunan hillitty 10 sekunnin laskuri ja klikattava varalinkki -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 w-full max-w-xs px-6 flex flex-col items-center gap-1.5">
        <a
            href="https://kielioppikurssi.github.io/kielioppikurssi/"
            class="text-[11px] sm:text-xs text-amber-200/75 hover:text-amber-300 transition-colors tracking-wider font-light text-center"
        >
            Tenn' omentielva enta <span id="countdown-seconds" class="font-medium text-orange-400">10</span>...
        </a>
        <div class="w-44 sm:w-56 h-[2px] bg-neutral-900 rounded-full overflow-hidden pointer-events-none">
            <div id="progress-bar" class="ember-bar h-full w-full rounded-full"></div>
        </div>
    </footer>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. LUOTETTAVA 10 SEKUNNIN UUDELLEENOHJAUS
        // ==========================================
        const REDIRECT_URL = 'https://kielioppikurssi.github.io/kielioppikurssi/';
        const REDIRECT_DURATION_MS = 10000;
        const startPerfNow = performance.now();
        const startEpochMs = Date.now();
        let hasRedirected = false;

        const countdownEl = document.getElementById('countdown-seconds');
        const progressBarEl = document.getElementById('progress-bar');

        function performRedirect() {
            if (hasRedirected) return;
            hasRedirected = true;

            if (countdownEl) countdownEl.textContent = '0';
            if (progressBarEl) progressBarEl.style.width = '0%';

            try {
                window.location.replace(REDIRECT_URL);
            } catch (_err) {
                window.location.href = REDIRECT_URL;
            }

            // Varmistus, jos replace ei siirrä välittömästi
            setTimeout(() => {
                if (window.location.href !== REDIRECT_URL) {
                    window.location.href = REDIRECT_URL;
                }
            }, 150);
        }

        function updateTimer() {
            if (hasRedirected) return;

            const elapsedFromPerf = Math.max(0, performance.now() - startPerfNow);
            const elapsedFromEpoch = Math.max(0, Date.now() - startEpochMs);
            const elapsedMs = Math.max(elapsedFromPerf, elapsedFromEpoch);
            const remainingMs = Math.max(0, REDIRECT_DURATION_MS - elapsedMs);
            const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
            const progressPct = Math.max(0, Math.min(100, (remainingMs / REDIRECT_DURATION_MS) * 100));

            if (countdownEl) {
                countdownEl.textContent = String(remainingSec);
            }
            if (progressBarEl) {
                progressBarEl.style.width = `${progressPct}%`;
            }

            if (elapsedMs >= REDIRECT_DURATION_MS) {
                performRedirect();
                return;
            }

            requestAnimationFrame(updateTimer);
        }

        // Varajärjestelmät ajastuksen katkeamisen varalle
        const fallbackTimerId = window.setTimeout(performRedirect, REDIRECT_DURATION_MS + 50);
        const intervalId = window.setInterval(() => {
            const elapsed = Math.max(performance.now() - startPerfNow, Date.now() - startEpochMs);
            if (elapsed >= REDIRECT_DURATION_MS) {
                window.clearInterval(intervalId);
                window.clearTimeout(fallbackTimerId);
                performRedirect();
            }
        }, 250);

        // ==========================================
        // 2. SYVÄ TULENHEHKU-TEKSTUURI (ILMAN TEKSTIÄ TAI RIIMUJA)
        // ==========================================
        /**
         * Luo syvän oranssin-punaisen-kullanhehkuisen emissiokartan ilman tekstiä tai riimuja.
         */
        function createFieryGlowTexture() {
            const width = 1024;
            const height = 512;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Syvä sula tummanpunainen-oranssi pohja
            const baseGrad = ctx.createLinearGradient(0, 0, 0, height);
            baseGrad.addColorStop(0.0, '#ffae19');
            baseGrad.addColorStop(0.14, '#ff4d00');
            baseGrad.addColorStop(0.5, '#991b00');
            baseGrad.addColorStop(0.86, '#ff4d00');
            baseGrad.addColorStop(1.0, '#ffae19');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, width, height);

            // Hienovaraiset vaakasuuntaiset lämpöjuovat ilman merkkejä tai kaiverruksia
            for (let i = 0; i < 18; i++) {
                const y = ((i + 0.5) / 18) * height;
                const bandGrad = ctx.createLinearGradient(0, y - 14, 0, y + 14);
                bandGrad.addColorStop(0, 'rgba(255, 140, 0, 0)');
                bandGrad.addColorStop(0.5, i % 2 === 0 ? 'rgba(255, 200, 60, 0.22)' : 'rgba(120, 15, 0, 0.28)');
                bandGrad.addColorStop(1, 'rgba(255, 140, 0, 0)');
                ctx.fillStyle = bandGrad;
                ctx.fillRect(0, y - 14, width, 28);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        // ==========================================
        // 3. THREE.JS -NÄKYMÄ JA PELKISTETTY SORMUS
        // ==========================================
        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            const camera = new THREE.PerspectiveCamera(
                36,
                container.clientWidth / container.clientHeight,
                0.1,
                100
            );
            // Hieman kauempana, jotta sormus mahtuu turvallisesti yläkuvan alapuolelle ja alareunan yläpuolelle
            camera.position.set(0, 0.35, 8.3);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            container.appendChild(renderer.domElement);

            const emissiveTexture = createFieryGlowTexture();

            // Sirompi ja puhdas comfort-fit-poikkileikkaus ilman kaiverruksia
            const profilePoints = [];
            const profileSteps = 72;
            const innerRadius = 1.16;     // Hieman pienempi säde
            const halfBandWidth = 0.36;   // Siro kaistaleen leveys
            const wallThickness = 0.21;   // Puhdas paksuus
            const outerDome = 0.095;
            const innerCurve = 0.035;

            for (let i = 0; i <= profileSteps; i++) {
                const t = (i / profileSteps) * Math.PI * 2;
                const cosT = Math.cos(t);
                const sinT = Math.sin(t);

                const y = Math.sign(sinT) * Math.pow(Math.abs(sinT), 0.78) * halfBandWidth;
                let r;
                if (cosT >= 0) {
                    r = innerRadius + wallThickness - outerDome + Math.pow(cosT, 0.62) * outerDome;
                } else {
                    r = innerRadius + (1.0 - Math.pow(Math.abs(cosT), 1.25)) * innerCurve;
                }
                profilePoints.push(new THREE.Vector2(r, y));
            }

            const ringGeometry = new THREE.LatheGeometry(profilePoints, 192);

            // UV-kartoitus ulko- ja sisäpinnalle
            const uvAttr = ringGeometry.attributes.uv;
            const posAttr = ringGeometry.attributes.position;
            const midRadius = innerRadius + wallThickness * 0.48;

            for (let i = 0; i < uvAttr.count; i++) {
                const u = uvAttr.getX(i);
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);
                const radialDist = Math.hypot(x, z);
                const normY = THREE.MathUtils.clamp((y / (halfBandWidth * 2.0)) + 0.5, 0, 1);

                const v = radialDist >= midRadius
                    ? 0.50 + normY * 0.50
                    : normY * 0.50;

                uvAttr.setXY(i, u * 2.0, v);
            }
            uvAttr.needsUpdate = true;
            ringGeometry.computeVertexNormals();

            // Sileä tulenhehkuva materiaali ilman kaiverruksia tai tekstiä
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(0x3a1202),
                metalness: 0.85,
                roughness: 0.2,
                emissive: new THREE.Color(0xff5a00),
                emissiveMap: emissiveTexture,
                emissiveIntensity: 1.5
            });

            const ringPivot = new THREE.Group();
            const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);

            // Diagonaalinen asento
            ringMesh.rotation.z = THREE.MathUtils.degToRad(26);
            ringMesh.rotation.x = THREE.MathUtils.degToRad(32);
            ringPivot.add(ringMesh);
            scene.add(ringPivot);

            // Hienovaraiset leijailevat kipinät tummalla taustalla
            const particleCount = 46;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSpeeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.0 + Math.random() * 1.35;
                particlePositions[i * 3] = Math.cos(angle) * radius;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 2.2;
                particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
                particleSpeeds[i] = 0.16 + Math.random() * 0.32;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0xff8c1a,
                size: 0.03,
                transparent: true,
                opacity: 0.72,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const embers = new THREE.Points(particleGeo, particleMat);
            scene.add(embers);

            // Lämpimät reunavalot
            const keyRimLight = new THREE.DirectionalLight(0xffb347, 2.1);
            keyRimLight.position.set(4, 5, 4);
            scene.add(keyRimLight);

            const backRimLight = new THREE.DirectionalLight(0xff4d00, 1.8);
            backRimLight.position.set(-4, -3, -4);
            scene.add(backRimLight);

            const coreGlowLight = new THREE.PointLight(0xff6600, 2.4, 8);
            coreGlowLight.position.set(0, 0, 0.2);
            scene.add(coreGlowLight);

            // Post-processing: UnrealBloomPass
            const composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(container.clientWidth, container.clientHeight),
                1.0,
                0.65,
                0.45
            );
            composer.addPass(bloomPass);

            // Hiiri- ja kosketusohjaus
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enableZoom = false;
            controls.enablePan = false;

            // Responsiivinen koonmuutos
            window.addEventListener('resize', () => {
                if (!container) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
                composer.setSize(w, h);
                bloomPass.resolution.set(w, h);
            });

            // Animaatiosilmukka
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Tasainen pyöritys ja kevyt leijunta yläkuvan alapuolella
                ringPivot.rotation.y = elapsed * 0.48;
                ringPivot.position.y = Math.sin(elapsed * 1.15) * 0.04 - 0.34;

                // Tulen elävä syke
                const pulse = 1.42 + Math.sin(elapsed * 2.6) * 0.24 + Math.sin(elapsed * 6.2) * 0.07;
                ringMaterial.emissiveIntensity = pulse;
                coreGlowLight.intensity = 2.1 + Math.sin(elapsed * 2.8) * 0.5;

                // Kipinöiden liike
                const posArr = embers.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    posArr[i * 3 + 1] += particleSpeeds[i] * delta;
                    if (posArr[i * 3 + 1] > 1.25) {
                        posArr[i * 3 + 1] = -1.25;
                    }
                }
                embers.geometry.attributes.position.needsUpdate = true;
                embers.rotation.y = elapsed * 0.12;

                controls.update();
                composer.render();
            }

            animate();
        }

        // Käynnistys sivun latauduttua
        window.addEventListener('load', () => {
            initThreeScene();
            requestAnimationFrame(updateTimer);
        });
    </script>
</body>
</html>
