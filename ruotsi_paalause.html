let current,score=0;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function createWord(t){let d=document.createElement('div');d.className='word';d.textContent=t;d.onclick=()=>moveWord(d);return d;}
function moveWord(el){const target=el.parentElement.id==='wordbank'?answer:wordbank;target.appendChild(el);el.classList.remove('move');void el.offsetWidth;el.classList.add('move');}
function newSentence(){current=sentences[Math.floor(Math.random()*sentences.length)];hint.innerHTML='<b>Vihje:</b> '+current.hint;wordbank.innerHTML='';answer.innerHTML='';shuffle(current.correct).forEach(w=>wordbank.appendChild(createWord(w)));}
function resetSentence(){while(answer.firstChild)wordbank.appendChild(answer.firstChild);}
function nextSentence(){popup.style.display='none';newSentence();}
function checkAnswer(){const user=[...answer.children].map(x=>x.textContent);if(user.length!==current.correct.length)return;let wrong=[];for(let i=0;i<current.correct.length;i++){if(user[i]!==current.correct[i])wrong.push([user[i],current.correct[i]]);}if(!wrong.length){score++;result.textContent='Pisteet: '+score;popupText.innerHTML=`<h2 style="color:green">✓ Oikein!</h2><p><b>${current.correct.join(' ')}</b></p><button onclick="nextSentence()">Seuraava lause</button>`;popup.style.display='block';return;}let h='<h2>Väärin</h2><p><b>Oikea sanajärjestys:</b><br>'+current.correct.join(' | ')+'</p><hr><b>Virheet:</b><br>';wrong.forEach(w=>h+=`<span class="bad">${w[0]}</span> → <span class="good">${w[1]}</span><br>`);h+='<br><button onclick="nextSentence()">Seuraava lause</button>';popupText.innerHTML=h;popup.style.display='block';}
