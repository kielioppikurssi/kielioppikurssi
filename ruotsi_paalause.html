<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Ruotsin sanajärjestys</title>
<style>
body{font-family:Palatino,"Palatino Linotype",Georgia,serif;max-width:1200px;margin:auto;padding:20px;background:linear-gradient(135deg,#d6e4ff,#fff5cc)}
h1{text-align:center}.home-button{position:fixed;top:15px;left:15px;background:#003399;color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:bold}
.area{background:white;border-radius:12px;padding:15px;margin:15px 0}#wordbank,#answer{display:flex;flex-wrap:wrap;gap:10px;min-height:80px}#answer{border:3px dashed #557}.word{background:#003399;color:white;padding:10px 16px;border-radius:10px;cursor:pointer;transition:.25s;user-select:none}.word:hover{transform:scale(1.06)}.move{animation:pop .3s}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}button{padding:10px 20px;font-size:16px;margin:5px}#result{font-size:22px;font-weight:bold}.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55)}.popup-content{background:white;max-width:800px;margin:80px auto;padding:25px;border-radius:12px}.bad{background:#ffd0d0;padding:4px 6px;border-radius:5px}.good{background:#c8f7c5;padding:4px 6px;border-radius:5px}
</style>
</head>
<body>
<a href="https://kielioppikurssi.github.io/kielioppikurssi/" class="home-button">← Päävalikko</a>
<h1>Ruotsin päälauseen sanajärjestys</h1>
<div id="hint"></div>
<div class="area"><h3>Sanat</h3><div id="wordbank"></div></div>
<div class="area"><h3>Vastauksesi</h3><div id="answer"></div></div>
<button onclick="checkAnswer()">Tarkista (Enter)</button>
<button onclick="resetSentence()">Tyhjennä</button>
<div id="result">Pisteet: 0</div>
<div class="popup" id="popup"><div class="popup-content"><div id="popupText"></div></div></div>
<script>
const sentences=[
{hint:'Aikamääre ensin',fi:'Tänään luen kirjaa.',correct:['Idag','läser','jag','en bok']},
{hint:'Paikkamääre ensin',fi:'Koulussa oppilaat syövät lounasta.',correct:['I skolan','äter','eleverna','lunch']},
{hint:'Tavallinen SVO',fi:'Siskoni ostaa huomenna uuden auton.',correct:['Min syster','köper','en ny bil','imorgon']},
{hint:'Adverbi mukana',fi:'Syön usein pizzaa perjantaisin.',correct:['Jag','äter','ofta','pizza','på fredagar']},
{hint:'V2-sääntö',fi:'Illalla katsomme televisiota.',correct:['På kvällen','tittar','vi','på tv']},
{hint:'Aikamääre ensin',fi:'Huomenna pelaamme jalkapalloa.',correct:['Imorgon','ska','vi','spela fotboll']},
{hint:'Paikkamääre ensin',fi:'Kirjastossa hän lukee sanomalehteä.',correct:['I biblioteket','läser','hon','en tidning']},
{hint:'V2-sääntö',fi:'Koulun jälkeen lapset syövät jäätelöä.',correct:['Efter skolan','äter','barnen','glass']},
{hint:'Adverbi mukana',fi:'Hän tulee usein myöhässä.',correct:['Hon','kommer','ofta','för sent']},
{hint:'Aikamääre ensin',fi:'Ensi viikolla he matkustavat Ruotsiin.',correct:['Nästa vecka','reser','de','till Sverige']}
];
let current,score=0;const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function createWord(t){const d=document.createElement('div');d.className='word';d.textContent=t;d.onclick=()=>moveWord(d);return d;}
function moveWord(el){const target=el.parentElement.id==='wordbank'?answer:wordbank;target.appendChild(el);el.classList.remove('move');void el.offsetWidth;el.classList.add('move');}
function newSentence(){current=sentences[Math.floor(Math.random()*sentences.length)];hint.innerHTML='<b>Vihje:</b> '+current.hint;wordbank.innerHTML='';answer.innerHTML='';shuffle(current.correct).forEach(w=>wordbank.appendChild(createWord(w)));}
function resetSentence(){while(answer.firstChild)wordbank.appendChild(answer.firstChild);}
function nextSentence(){popup.style.display='none';newSentence();}
function checkAnswer(){const user=[...answer.children].map(x=>x.textContent);if(user.length!==current.correct.length)return;let wrong=[];for(let i=0;i<current.correct.length;i++){if(user[i]!==current.correct[i])wrong.push([user[i],current.correct[i]]);}if(!wrong.length){score++;result.textContent='Pisteet: '+score;popupText.innerHTML=`<h2 style="color:green">✓ Oikein!</h2><p><b>Ruotsi:</b><br>${current.correct.join(' ')}</p><p><b>Suomi:</b><br>${current.fi}</p><button onclick="nextSentence()">Seuraava lause</button>`;popup.style.display='block';return;}let h=`<h2>Väärin</h2><p><b>Ruotsi:</b><br>${current.correct.join(' ')}</p><p><b>Suomi:</b><br>${current.fi}</p><hr><b>Virheet:</b><br>`;wrong.forEach(w=>h+=`<span class="bad">${w[0]}</span> → <span class="good">${w[1]}</span><br>`);h+='<br><button onclick="nextSentence()">Seuraava lause</button>';popupText.innerHTML=h;popup.style.display='block';}
document.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});newSentence();
</script></body></html>
