function moveWord(el){const target=el.parentElement.id==='wordbank'?answer:wordbank;target.appendChild(el);el.classList.remove('move');void el.offsetWidth;el.classList.add('move');}
function newSentence(){current=sentences[Math.floor(Math.random()*sentences.length)];hint.innerHTML='<b>Vihje:</b> '+current.hint;wordbank.innerHTML='';answer.innerHTML='';shuffle(current.correct).forEach(w=>wordbank.appendChild(createWord(w)));}
function resetSentence(){while(answer.firstChild)wordbank.appendChild(answer.firstChild);}

function checkAnswer(){const user=[...answer.children].map(x=>x.textContent);if(user.length!==current.correct.length)return;let wrong=[];for(let i=0;i<current.correct.length;i++){if(user[i]!==current.correct[i])wrong.push([user[i],current.correct[i]]);}if(!wrong.length){score++;result.textContent='Pisteet: '+score;popupText.innerHTML=`<h2 style="color:green">✓ Oikein!</h2><p><b>Ruotsi:</b><br>${current.correct.join(' ')}</p><p><b>Suomi:</b><br>${current.fi}</p><button onclick="nextSentence()">Seuraava lause (Enter)</button>`;popup.style.display='block';return;}let h=`<h2>Väärin</h2><p><b>Ruotsi:</b><br>${current.correct.join(' ')}</p><p><b>Suomi:</b><br>${current.fi}</p><hr><b>Virheet:</b><br>`;wrong.forEach(w=>h+=`<span class="bad">${w[0]}</span> → <span class="good">${w[1]}</span><br>`);h+='<br><button onclick="nextSentence()">Seuraava lause (Enter)</button>';popupText.innerHTML=h;popup.style.display='block';}
document.addEventListener('keydown',e=>{

});
