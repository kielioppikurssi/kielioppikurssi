<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruotsin epäsäännölliset verbit</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    padding: 20px 15px;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.main-container {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    padding-bottom: 60px;
}

.home-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0051ba;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    border: 1px solid #fecc00;
    box-shadow: 0 4px 12px rgba(0, 81, 186, 0.3);
    transition: all 0.2s ease;
    margin-bottom: 25px;
}

.home-button:hover {
    background: #003366;
    transform: translateY(-2px);
}

.card {
    background: #fdfbf7;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border: 3px solid #fecc00;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    color: #0051ba;
    font-size: 28px;
    margin-bottom: 20px;
}

h2 {
    color: #002e66;
    font-size: 20px;
    margin-bottom: 15px;
    border-bottom: 2px solid #eef2ff;
    padding-bottom: 8px;
}

.settings-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 15px;
    background: #f8fafc;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
}

.settings-row label {
    font-weight: bold;
    color: #475569;
    font-size: 14px;
}

select {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #0051ba;
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #002e66;
    outline: none;
    cursor: pointer;
}

.btn {
    background: #0051ba;
    color: white;
    border: 2px solid #fecc00;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(0, 81, 186, 0.3);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn:hover {
    background: #003366;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #e2e8f0;
    color: #334155;
    border: 1px solid #cbd5e1;
    box-shadow: none;
}

.btn-secondary:hover {
    background: #cbd5e1;
}

/* Monivalinnat */
.mc-question {
    background: #ffffff;
    padding: 14px 18px;
    margin: 10px 0;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

@media(min-width: 650px) {
    .mc-question {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
    }
}

.mc-question b {
    color: #002e66;
    font-size: 16px;
}

.mc-options {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.mc-options label {
    background: #f1f5f9;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.mc-options label:hover {
    background: #e2e8f0;
}

/* Taulukot */
.table-container {
    width: 100%;
    overflow-x: auto;
    margin: 15px 0;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    text-align: left;
    font-size: 15px;
}

th, td {
    padding: 12px 14px;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #0051ba;
    color: white;
    font-weight: bold;
}

input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}

input[type="text"]:focus {
    border-color: #0051ba;
}

.correct {
    background: #dcfce7 !important;
    color: #166534;
    border-color: #4ade80 !important;
}

.wrong {
    background: #fee2e2 !important;
    color: #991b1b;
    border-color: #f87171 !important;
    font-weight: bold;
}

.partial {
    background: #fef9c3 !important;
    color: #854d0e;
}

/* Tilastopalkki alhaalla */
.stats-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 30px;
    font-size: 16px;
    font-weight: bold;
    z-index: 1000;
    border-top: 2px solid #fecc00;
    box-shadow: 0 -10px 20px rgba(0,0,0,0.3);
}

.stats-bar span {
    color: #fecc00;
}

/* Popup - Ei sumennusta, jotta taustalta voi luntata! */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 20px;

.popup-content {

    width: 100%;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8);

}

@keyframes modalPop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }

.popup-content h2 {
    font-size: 24px;

.controls-group {

        </div>
    </div>
</div>

function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playSuccessSound() {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
        });
    } catch(e) {}
}

function playErrorSound() {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function getFilteredVerbs(){
    const level = document.getElementById("verbLevel").value;
    if(level==="all"){
        return verbs;
    }
    return verbs.filter(v => String(v.level) === level);
}

    ? `<tr><th>Suomi</th><th>Infinitiivi</th><th>Preesens</th><th>Imperfekti</th><th>Supiini</th></tr>`
    : `<tr><th>Infinitiivi</th><th>Preesens</th><th>Imperfekti</th><th>Supiini</th><th>Suomennos</th></tr>`;

    currentSet = shuffle(getFilteredVerbs()).slice(0, count);
    const tbody = document.getElementById("quizBody");
    tbody.innerHTML = "";

    currentSet.forEach((verb,row)=>{
        let tr = document.createElement("tr");
        let html = "";
        if(mode==="sv-forms"){
            html += `<td><b>${verb.fi}</b></td>`;
            for(let i=0;i<4;i++){
                html += `<td><input type="text" data-row="${row}" data-col="${i}" autocomplete="off" spellcheck="false"></td>`;
            }
        }else{
            html += `
                <td>${verb.forms[0]}</td>
                <td>${verb.forms[1]}</td>
                <td>${verb.forms[2]}</td>
                <td>${verb.forms[3]}</td>
                <td><input type="text" data-row="${row}" data-col="fi" autocomplete="off" spellcheck="false"></td>
            `;
        }
        tr.innerHTML = html;
        tbody.appendChild(tr);
    });
    document.getElementById("feedback").textContent="";
}

function similarity(a,b){
    a = a.toLowerCase();
    b = b.toLowerCase();
    const matrix = [];
    for(let i=0;i<=b.length;i++) matrix[i] = [i];
    for(let j=0;j<=a.length;j++) matrix[0][j] = j;
    for(let i=1;i<=b.length;i++){
        for(let j=1;j<=a.length;j++){
            if(b.charAt(i-1)===a.charAt(j-1)){
                matrix[i][j]=matrix[i-1][j-1];
            }else{
                matrix[i][j]=Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
            }
        }
    }
    return 1-matrix[b.length][a.length]/Math.max(a.length,b.length);
}

const alternatives = {
    "gett": ["givit"],
    "givit": ["gett"],
    "gett upp": ["givit upp"],
    "givit upp": ["gett upp"]
};

function checkAnswers(){
    let points = 0;
    const mode = document.getElementById("exerciseMode").value;
    const count = parseInt(document.getElementById("verbCount").value);
    let roundWrongVerbs = [];

    document.querySelectorAll("#quizBody input").forEach((input, idx)=>{
        const row = Math.floor(idx / (mode==="sv-forms" ? 4 : 1));
        let correct = "";
        if(mode==="sv-forms"){
            const col = idx % 4;
            correct = currentSet[row].forms[col].trim().toLowerCase();
        }else{
            correct = currentSet[row].fi.trim().toLowerCase();
        }

        const user = input.value.trim().toLowerCase();
        const sim = similarity(user,correct);
        const accepted = [correct].concat(alternatives[correct] || []);

        if(accepted.includes(user)){
            input.className = "correct";
            points += 1;
        }else if(sim >= 0.75){
            input.className = "partial";
            points += 0.5;
            input.value = `${user} → ${correct}`;
            if(!roundWrongVerbs.includes(currentSet[row])) roundWrongVerbs.push(currentSet[row]);
        }else{
            input.className = "wrong";
            input.value = correct;
            if(!roundWrongVerbs.includes(currentSet[row])) roundWrongVerbs.push(currentSet[row]);
        }
    });

    totalScore += points;
    document.getElementById("totalScore").textContent = totalScore;

    let maxPoints = mode==="sv-forms" ? count * 4 : count;
    
    if(points === maxPoints){
        playSuccessSound();
        streak++;
        showPopup("🏆 Täydellistä! | Perfekt!", `${points}/${maxPoints} pistettä. Loistavaa työtä!`);
    } else {
        playErrorSound();
        streak = 0;
        
        if(roundWrongVerbs.length > 0 && mode==="sv-forms"){
            const bonusVerb = roundWrongVerbs[Math.floor(Math.random() * roundWrongVerbs.length)];
            openBonusPopup(bonusVerb);
            return;
        } else {
            showPopup("💪 Harjoitus tekee mestarin!", `Sait ${points}/${maxPoints} pistettä.`);
        }
    }

    if(streak > bestStreak){
        bestStreak = streak;
        localStorage.setItem('verb_best_streak', bestStreak);
        document.getElementById('bestStreak').textContent = bestStreak;
    }
    document.getElementById('streak').textContent = streak;
}

function openBonusPopup(verb) {
    document.getElementById("popupTitle").textContent = "🌟 Kertaushaaste (Bonusruutu)!";
    document.getElementById("popupText").innerHTML = `Korjataanpas tämä verbi: <b>${verb.fi}</b>.<br>Kirjoita kaikki 4 muotoa oikein, niin saat <b>tuplapisteet</b>! (Ei rangaistusta väärästä).`;
    
    let html = `
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; text-align: left;">
            <label style="font-size: 13px; font-weight: bold;">Infinitiivi / Preesens / Imperfekti / Supiini:</label>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
                <input type="text" id="b0" placeholder="1." autocomplete="off">
                <input type="text" id="b1" placeholder="2." autocomplete="off">
                <input type="text" id="b2" placeholder="3." autocomplete="off">
                <input type="text" id="b3" placeholder="4." autocomplete="off">
            </div>
        </div>
    `;
    document.getElementById("popupBody").innerHTML = html;
    document.getElementById("popupBtn").textContent = "Tarkista bonus";
    document.getElementById("popupBtn").onclick = function() {
        checkBonusAnswer(verb);
    };
    document.getElementById("popup").style.display = "flex";
}

function checkBonusAnswer(verb) {
    let allRight = true;
    for(let i=0; i<4; i++) {
        let val = document.getElementById("b"+i).value.trim().toLowerCase();
        let correct = verb.forms[i].toLowerCase();
        let accepted = [correct].concat(alternatives[correct] || []);
        if(!accepted.includes(val)) {
            allRight = false;
        }
    }

    if(allRight) {
        playSuccessSound();
        totalScore += 4;
        document.getElementById("totalScore").textContent = totalScore;
        document.getElementById("popupTitle").textContent = "🎉 Mahtavaa! Oikein!";
        document.getElementById("popupText").innerHTML = `Sait ansaitut tuplapisteet pottiin! Olet huikea oppija! 🚀`;
        document.getElementById("popupBody").innerHTML = "";
        document.getElementById("popupBtn").textContent = "Jatka";
        document.getElementById("popupBtn").onclick = closePopup;
    } else {
        playSuccessSound();
        document.getElementById("popupTitle").textContent = "👍 Melkein! Ei hätää";
        document.getElementById("popupText").innerHTML = `Oikeat muodot olivat:<br><b>${verb.forms.join(', ')}</b>.<br>Jatketaan eteenpäin, opit kyllä! 💪`;
        document.getElementById("popupBody").innerHTML = "";
        document.getElementById("popupBtn").textContent = "Jatka";
        document.getElementById("popupBtn").onclick = closePopup;
    }
}

function toggleCheatSheet(){
    const panel = document.getElementById("cheatSheet");
    panel.style.display = panel.style.display==="none" ? "block" : "none";
}

function buildVerbList(){
    const mode = document.getElementById("sortMode").value;
    const sorted = [...getFilteredVerbs()];
    if(mode==="fi"){
        sorted.sort((a,b)=> a.fi.localeCompare(b.fi,"fi"));
    }else{
        sorted.sort((a,b)=> a.forms[0].localeCompare(b.forms[0],"sv"));
    }

    const container = document.getElementById("verbList");
    container.innerHTML = `
        <table>
            <tr><th>Suomi</th><th>Infinitiivi</th><th>Preesens</th><th>Imperfekti</th><th>Supiini</th></tr>
            ${sorted.map(v=>`<tr><td><b>${v.fi}</b></td><td>${v.forms[0]}</td><td>${v.forms[1]}</td><td>${v.forms[2]}</td><td>${v.forms[3]}</td></tr>`).join("")}
        </table>
    `;
}

let currentMC = [];
let currentDirection = "";

function createMCQuiz(){
    const box = document.getElementById("mcQuiz");
    mcChecked = false;
    currentDirection = document.getElementById("mcDirection").value;
    const filtered = getFilteredVerbs().filter(v => v.forms[0] !== "-");
    
    if(filtered.length < 3){
        box.innerHTML = "<p>Valitussa luokassa pitää olla vähintään 3 verbiä.</p>";
        return;
    }

    currentMC = shuffle(filtered).slice(0,5);
    let html = "";

    currentMC.forEach((verb,i)=>{
        const correct = currentDirection === "fi-sv" ? verb.forms[0] : verb.fi;
        const wrong1 = shuffle(getFilteredVerbs().filter(v=>v!==verb))[0];
        const wrong2 = shuffle(getFilteredVerbs().filter(v=>v!==verb))[1];

        const choices = shuffle([
            correct,
            currentDirection==="fi-sv" ? wrong1.forms[0] : wrong1.fi,
            currentDirection==="fi-sv" ? wrong2.forms[0] : wrong2.fi
        ]);

        html += `
            <div class="mc-question">
                <b>${currentDirection==="fi-sv" ? verb.fi : verb.forms[0]}</b>
                <div class="mc-options">
                    ${choices.map(choice => `
                        <label>
                            <input type="radio" name="mc${i}" value="${choice}">
                            ${choice}
                        </label>
                    `).join("")}
                </div>
            </div>
        `;
    });

    box.innerHTML = html;
    document.getElementById("mcResult").textContent = "";
}

function showPopup(title,text){
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupText").textContent = text;
    document.getElementById("popupBody").innerHTML = "";
    document.getElementById("popupBtn").textContent = "Jatka";
    document.getElementById("popupBtn").onclick = closePopup;
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function checkMC(){
    if(mcChecked) return;
    mcChecked = true;
    let points = 0;

    currentMC.forEach((verb,i)=>{
        const correct = currentDirection==="fi-sv" ? verb.forms[0] : verb.fi;
        const radios = document.querySelectorAll(`input[name="mc${i}"]`);

        radios.forEach(radio=>{
            radio.disabled = true;
            const label = radio.parentElement;
            if(radio.value===correct){
                label.style.background = "#dcfce7";
                label.style.borderColor = "#4ade80";
            }
            if(radio.checked){
                if(radio.value===correct){
                    points++;
                }else{
                    label.style.background = "#fee2e2";
                    label.style.borderColor = "#f87171";
                }
            }
        });
    });

    totalScore += points;
    document.getElementById("totalScore").textContent = totalScore;
    document.getElementById("mcResult").textContent = `Monivalinnan tulos: ${points}/5 pistettä`;
    if(points === 5) playSuccessSound();
    else playErrorSound();
}

refreshAll();
