body{

.home-button:hover{

    /* MOBIILI */

let currentWords = [];
let hintedCells = new Set();

function shuffle(a){
    return [...a].sort(()=>Math.random()-0.5);
}

function generateExercise(){

    hintedCells.clear();

currentWords = [
    shuffle(nouns.filter(n => n.class === 1))[0],
    shuffle(nouns.filter(n => n.class === 2))[0],
    shuffle(nouns.filter(n => n.class === 3))[0],
    shuffle(nouns.filter(n => n.class === 4))[0],
    shuffle(nouns.filter(n => n.class === 5))[0]
];
    const tbody=document.querySelector("#exerciseTable tbody");
    tbody.innerHTML="";

    currentWords.forEach((word,row)=>{

        let tr=document.createElement("tr");

        tr.innerHTML=`
        <td>${word.fi}</td>
        <td>${word.class}</td>
        <td><input></td>
        <td><input></td>
        <td><input></td>
        <td><input></td>
        `;

        tbody.appendChild(tr);
    });

    document.getElementById("result").textContent="";
}

function checkAnswers(){

    let score=0;
    let max=0;

    document.querySelectorAll("#exerciseTable tbody tr").forEach((tr,row)=>{

        const inputs=tr.querySelectorAll("input");

        inputs.forEach((input,col)=>{

            const key=`${row}-${col}`;
            const answer=currentWords[row].forms[col];
            const user=input.value.trim();

            if(!hintedCells.has(key)){
                max++;
            }

            if(user===""){

                input.value=answer;
                input.style.background="#fff59d"; // keltainen

                hintedCells.add(key);

                max--;

                return;
            }

            if(user.toLowerCase()===answer.toLowerCase()){

                if(!hintedCells.has(key)){
                    score++;
                }

                input.className="correct";
            }
            else{

                input.className="wrong";
                input.title=`Oikea vastaus: ${answer}`;
            }
        });

    });

    document.getElementById("result").textContent=
        `Pisteet: ${score} / ${max}`;
}
function giveHint(){

    let candidates=[];

    document.querySelectorAll("#exerciseTable tbody tr").forEach((tr,row)=>{

        tr.querySelectorAll("input").forEach((input,col)=>{

            if(input.value.trim()===""){
                candidates.push({row,col,input});
            }
        });
    });

    if(candidates.length===0) return;

    let choice=
        candidates[Math.floor(Math.random()*candidates.length)];

    choice.input.value=
        currentWords[choice.row].forms[choice.col];

    choice.input.classList.add("hint");

    hintedCells.add(`${choice.row}-${choice.col}`);
}

generateExercise();
