let current;
let correct = 0;
let wrong = 0;

function nextQuestion(){
    current = tasks[Math.floor(Math.random()*tasks.length)];
    document.getElementById("russian").textContent = current.base;
    document.getElementById("finnish").textContent = current.finnish;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerHTML = "";
    document.getElementById("answer").focus();
}

function checkAnswer(){

    const user = document
        .getElementById("answer")
        .value
        .trim()
        .replace(/\s+/g," ")
        .toLowerCase();

    const correctAnswer = current.answer
        .toLowerCase();

    if(user === correctAnswer){

        correct++;
        document.getElementById("correctCount").textContent = correct;

        document.getElementById("result").innerHTML =
            `<span class="correct">✓ Oikein</span>`;

    }else{

        wrong++;
        document.getElementById("wrongCount").textContent = wrong;

        document.getElementById("result").innerHTML =
            `<span class="wrong">✗ Väärin</span><br>
             Oikea vastaus: <b>${current.answer}</b>`;
    }
}

document.getElementById("answer").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        checkAnswer();
    }
});
